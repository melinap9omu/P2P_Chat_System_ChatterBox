environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.2
  file_picker: ^6.2.1
 
  

  
  crypton: ^2.0.1

  flutter_webrtc: ^0.14.2
  web_socket_channel: ^3.0.3
  pointycastle: ^3.7.3
  encrypt: ^5.0.1
  flutter_secure_storage: ^8.0.0
  json_annotation: ^4.8.1
  freezed_annotation: ^3.1.0
  http: ^1.2.1
  asn1lib: ^1.1.0
  uuid: ^4.0.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  permission_handler: ^12.0.1
  open_file_plus: ^3.4.1
  google_fonts: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
